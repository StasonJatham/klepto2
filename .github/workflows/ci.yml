name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15.2'

      - name: Check formatting
        run: |
          python -m pip install black==26.10.1
          python -m black --check .

      - name: Build image
        run: docker build -t klepto2:ci .

      - name: Scan Docker Hub example
        run: sh tests/smoke.sh klepto2:ci
